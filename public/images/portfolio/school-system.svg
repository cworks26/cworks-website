  <!-- Table header -->
  <rect x="270" y="130" width="480" height="25" rx="4" fill="#0F172A"/>
  <text x="285" y="147" fill="#94A3B8" font-family="sans-serif" font-size="9">Name</text>
  <text x="380" y="147" fill="#94A3B8" font-family="sans-serif" font-size="9">ID</text>
  <text x="450" y="147" fill="#94A3B8" font-family="sans-serif" font-size="9">Fees</text>
  <text x="530" y="147" fill="#94A3B8" font-family="sans-serif" font-size="9">Avg Score</text>
  <text x="620" y="147" fill="#94A3B8" font-family="sans-serif" font-size="9">Status</text>
  <!-- Table rows -->
  <rect x="270" y="165" width="480" height="22" rx="3" fill="#1E293B"/>
  <rect x="270" y="195" width="480" height="22" rx="3" fill="#1E293B"/>
  <rect x="270" y="225" width="480" height="22" rx="3" fill="#1E293B"/>
  <!-- Stats cards -->
  <rect x="250" y="290" width="160" height="80" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="280" y="320" fill="#10B981" font-family="sans-serif" font-size="22" font-weight="bold">96%</text>
  <text x="280" y="345" fill="#94A3B8" font-family="sans-serif" font-size="10">Fee Collection</text>
  <rect x="430" y="290" width="160" height="80" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="460" y="320" fill="#3B82F6" font-family="sans-serif" font-size="22" font-weight="bold">B+</text>
  <text x="460" y="345" fill="#94A3B8" font-family="sans-serif" font-size="10">Avg Grade</text>
  <rect x="610" y="290" width="160" height="80" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="640" y="320" fill="#F59E0B" font-family="sans-serif" font-size="22" font-weight="bold">12</text>
  <text x="640" y="345" fill="#94A3B8" font-family="sans-serif" font-size="10">Active Classes</text>
