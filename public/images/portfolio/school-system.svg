<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  <!-- Header -->
  <rect x="30" y="20" width="740" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="50" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">🏫 Kampala International Academy</text>
  <rect x="580" y="34" width="90" height="22" rx="6" fill="#3B82F6" opacity="0.2"/>
  <text x="595" y="49" fill="#3B82F6" font-family="sans-serif" font-size="10">3,247 Students</text>
  <!-- Sidebar -->
  <rect x="30" y="85" width="200" height="390" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <rect x="50" y="110" width="160" height="8" rx="4" fill="#3B82F6" opacity="0.6"/>
  <rect x="50" y="135" width="160" height="8" rx="4" fill="#334155"/>
  <rect x="50" y="160" width="160" height="8" rx="4" fill="#334155"/>
  <rect x="50" y="185" width="160" height="8" rx="4" fill="#334155"/>
