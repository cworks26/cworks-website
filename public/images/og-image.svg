<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#1E293B" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#1E293B" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#1E293B" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#1E293B" stroke-width="0.5" opacity="0.2"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1E293B" stroke-width="0.5" opacity="0.2"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#1E293B" stroke-width="0.5" opacity="0.2"/>
  <!-- Logo area -->
  <rect x="80" y="80" width="60" height="60" rx="12" fill="#3B82F6" opacity="0.2"/>
  <text x="110" y="122" fill="#3B82F6" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle">CW</text>
  <text x="155" y="122" fill="white" font-family="sans-serif" font-size="24" font-weight="bold">CWorks</text>
  <!-- Main text -->
  <text x="600" y="280" fill="white" font-family="sans-serif" font-size="64" font-weight="bold" text-anchor="middle">We Build Digital.</text>
  <text x="600" y="360" fill="url(#text-grad)" font-family="sans-serif" font-size="64" font-weight="bold" text-anchor="middle">We Ship Results.</text>
  <!-- Subtitle -->
  <text x="600" y="430" fill="#94A3B8" font-family="sans-serif" font-size="22" text-anchor="middle">Kampala-Based Digital Agency — Web Development, UI/UX Design &amp; Custom Systems</text>
  <!-- URL -->
  <text x="600" y="550" fill="#475569" font-family="sans-serif" font-size="18" text-anchor="middle">cworks.tech</text>
  <!-- Decorative elements -->
  <circle cx="100" cy="500" r="80" fill="#3B82F6" opacity="0.05"/>
  <circle cx="1100" cy="150" r="120" fill="#818CF8" opacity="0.05"/>
</svg>