<svg xmlns="http://www.w3.org/2000/svg" width="800" height="566" viewBox="0 0 800 566">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="566" fill="url(#bg)" rx="16"/>
  <!-- Desk/laptop -->
  <rect x="180" y="200" width="440" height="240" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <!-- Screen content -->
  <rect x="200" y="220" width="400" height="160" rx="4" fill="#020617"/>
  <!-- Code lines on screen -->
  <rect x="220" y="240" width="80" height="6" rx="3" fill="#3B82F6" opacity="0.6"/>
  <rect x="220" y="255" width="120" height="6" rx="3" fill="#10B981" opacity="0.4"/>
  <rect x="220" y="270" width="60" height="6" rx="3" fill="#F59E0B" opacity="0.4"/>
  <rect x="220" y="285" width="160" height="6" rx="3" fill="#94A3B8" opacity="0.3"/>
  <rect x="220" y="300" width="90" height="6" rx="3" fill="#3B82F6" opacity="0.5"/>
  <rect x="220" y="315" width="140" height="6" rx="3" fill="#10B981" opacity="0.3"/>
  <rect x="220" y="330" width="200" height="6" rx="3" fill="#94A3B8" opacity="0.2"/>
  <rect x="220" y="345" width="70" height="6" rx="3" fill="#F59E0B" opacity="0.4"/>
  <!-- Design frame right -->
  <rect x="440" y="235" width="140" height="100" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="455" y="250" width="110" height="8" rx="3" fill="#334155"/>
  <rect x="455" y="268" width="80" height="8" rx="3" fill="#3B82F6" opacity="0.4"/>
  <rect x="455" y="286" width="110" height="8" rx="3" fill="#334155"/>
  <rect x="455" y="304" width="60" height="8" rx="3" fill="#334155"/>
  <rect x="455" y="318" width="90" height="18" rx="5" fill="#3B82F6" opacity="0.6"/>
  <!-- Person 1 -->
  <circle cx="300" cy="140" r="38" fill="#3B82F6" opacity="0.3"/>
  <text x="300" y="148" fill="white" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">👩‍💻</text>
  <rect x="260" y="178" width="80" height="14" rx="4" fill="white" opacity="0.6"/>
  <!-- Person 2 -->
  <circle cx="500" cy="140" r="38" fill="#10B981" opacity="0.3"/>
  <text x="500" y="148" fill="white" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">👨‍💻</text>
  <rect x="460" y="178" width="80" height="14" rx="4" fill="white" opacity="0.6"/>
  <!-- Person 3 -->
  <circle cx="650" cy="80" r="32" fill="#F59E0B" opacity="0.3"/>
  <text x="650" y="87" fill="white" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🎨</text>
  <rect x="614" y="112" width="72" height="12" rx="4" fill="white" opacity="0.5"/>
  <!-- Connection lines -->
  <line x1="338" y1="155" x2="462" y2="155" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="538" y1="130" x2="618" y2="95" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Keyboard -->
  <rect x="280" y="440" width="240" height="12" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <!-- Trackpad -->
  <rect x="350" y="458" width="100" height="8" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <!-- Bottom label -->
  <text x="400" y="520" fill="#94A3B8" font-family="sans-serif" font-size="14" text-anchor="middle">Kampala, Uganda</text>
</svg>