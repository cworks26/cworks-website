<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="500" fill="transparent"/>
  <!-- Central horizontal line -->
  <line x1="80" y1="250" x2="920" y2="250" stroke="url(#line-grad)" stroke-width="2"/>
  
  <!-- Step 1: Discovery (left) -->
  <line x1="200" y1="250" x2="200" y2="180" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="250" r="10" fill="#3B82F6" opacity="0.3"/>
  <circle cx="200" cy="250" r="5" fill="#3B82F6"/>
  <rect x="120" y="50" width="160" height="90" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="200" y="80" fill="#3B82F6" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🔍</text>
  <text x="200" y="105" fill="white" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Discovery</text>
  <text x="200" y="125" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Understanding goals</text>
  
  <!-- Step 2: Design -->
  <line x1="380" y1="250" x2="380" y2="180"/>
  <circle cx="380" cy="250" r="10" fill="#818CF8" opacity="0.3"/>
  <circle cx="380" cy="250" r="5" fill="#818CF8"/>
  <rect x="300" y="50" width="160" height="90" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="380" y="80" fill="#818CF8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🎨</text>
  <text x="380" y="105" fill="white" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Design</text>
  <text x="380" y="125" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Wireframes &amp; mockups</text>
  
  <!-- Step 3: Development (below line) -->
  <line x1="560" y1="250" x2="560" y2="320" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>
  <circle cx="560" cy="250" r="10" fill="#10B981" opacity="0.3"/>
  <circle cx="560" cy="250" r="5" fill="#10B981"/>
  <rect x="480" y="340" width="160" height="90" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="560" y="370" fill="#10B981" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⚙️</text>
  <text x="560" y="395" fill="white" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Development</text>
  <text x="560" y="415" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Build &amp; test</text>
  
  <!-- Step 4: Launch (right) -->
  <line x1="740" y1="250" x2="740" y2="180" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
  <circle cx="740" cy="250" r="10" fill="#F59E0B" opacity="0.3"/>
  <circle cx="740" cy="250" r="5" fill="#F59E0B"/>
  <rect x="660" y="50" width="160" height="90" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="740" y="80" fill="#F59E0B" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🚀</text>
  <text x="740" y="105" fill="white" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Launch</text>
  <text x="740" y="125" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Deploy &amp; support</text>
  
  <!-- Connecting arrows -->
  <path d="M220 210 L360 210" stroke="#334155" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#334155"/>
    </marker>
  </defs>
</svg>